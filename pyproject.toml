[project]
name = "company-recommendation-system"
version = "0.0.0"
description = "Turn a company event feed into a similar-companies service with RabbitMQ and pgvector."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aio-pika",
  "fastapi[standard]>=0.165.0",
  "pgvector>=0.5.1",
  "psycopg[binary]>=3.3.9",
  "sentence-transformers>=6.3.0",
  "sqlmodel>=0.0.50",
]

[tool.uv]
package = false
